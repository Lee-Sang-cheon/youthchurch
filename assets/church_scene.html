<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #080512; overflow: hidden; touch-action: none; }
    canvas { display: block; }
    #hint {
      position: fixed; bottom: 90px; left: 0; right: 0;
      text-align: center; font-family: sans-serif;
      font-size: 12px; color: rgba(255,255,255,0.35);
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="hint">바닥을 탭해서 이동해요</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function () {
  const GRID = 22;
  const HALF = GRID / 2;

  // ── Scene ───────────────────────────────────────────────
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0618, 0.032);

  // ── Isometric Camera ────────────────────────────────────
  const aspect = window.innerWidth / window.innerHeight;
  const D = 10;
  const camera = new THREE.OrthographicCamera(-D * aspect, D * aspect, D, -D, 0.1, 200);
  camera.position.set(14, 14, 14);
  camera.lookAt(0, 0, 0);

  // ── Renderer ────────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x0a0618);
  document.body.appendChild(renderer.domElement);

  // ── Lights ──────────────────────────────────────────────
  scene.add(new THREE.AmbientLight(0x8866bb, 0.8));

  const sun = new THREE.DirectionalLight(0xfff5e0, 1.8);
  sun.position.set(5, 30, -10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -25;
  sun.shadow.camera.right = 25;
  sun.shadow.camera.top = 25;
  sun.shadow.camera.bottom = -25;
  sun.shadow.camera.far = 100;
  scene.add(sun);

  // 스테인드글라스 색상 조명
  const stainedLeft  = new THREE.PointLight(0xff6633, 1.2, 18);
  stainedLeft.position.set(-9, 6, -5);
  scene.add(stainedLeft);

  const stainedRight = new THREE.PointLight(0x3399ff, 1.2, 18);
  stainedRight.position.set(9, 6, -5);
  scene.add(stainedRight);

  const altarGlow = new THREE.PointLight(0xffd700, 1.5, 10);
  altarGlow.position.set(0, 4, -8);
  scene.add(altarGlow);

  const fill = new THREE.DirectionalLight(0x4422aa, 0.4);
  fill.position.set(-12, 8, 12);
  scene.add(fill);

  // ── Helpers ─────────────────────────────────────────────
  function blendHex(c1, c2, t) {
    const r = v => (c1 >> v & 0xff) + ((c2 >> v & 0xff) - (c1 >> v & 0xff)) * t | 0;
    return r(16) << 16 | r(8) << 8 | r(0);
  }

  // ── Floor Tiles ─────────────────────────────────────────
  const tileGeo = new THREE.BoxGeometry(0.96, 0.10, 0.96);
  const matLight  = new THREE.MeshLambertMaterial({ color: 0x3a2e5c });
  const matDark   = new THREE.MeshLambertMaterial({ color: 0x2e2448 });
  const matEdge   = new THREE.MeshLambertMaterial({ color: 0x1a1230 });
  const matCarpet = new THREE.MeshLambertMaterial({ color: 0x6b1a1a });
  const matAisle  = new THREE.MeshLambertMaterial({ color: 0x8b2222 });

  for (let x = 0; x < GRID; x++) {
    for (let z = 0; z < GRID; z++) {
      const isEdge = x === 0 || x === GRID - 1 || z === 0 || z === GRID - 1;
      const isAisle = (x === 10 || x === 11) && z > 2 && z < GRID - 3;
      const isAltarCarpet = z <= 4 && !isEdge;
      let mat;
      if (isEdge) mat = matEdge;
      else if (isAisle || isAltarCarpet) mat = ((x + z) % 2 === 0) ? matCarpet : matAisle;
      else mat = (x + z) % 2 === 0 ? matLight : matDark;

      const tile = new THREE.Mesh(tileGeo, mat);
      tile.position.set(x - HALF, 0, z - HALF);
      tile.receiveShadow = true;
      scene.add(tile);
    }
  }

  // ── 강단(Stage) ──────────────────────────────────────────
  const stage = new THREE.Mesh(
    new THREE.BoxGeometry(14, 0.5, 4),
    new THREE.MeshLambertMaterial({ color: 0x5c3d1e })
  );
  stage.position.set(0.5, 0.25, -8);
  stage.receiveShadow = true;
  stage.castShadow = true;
  scene.add(stage);

  // 강단 앞면 황금 몰딩
  const molding = new THREE.Mesh(
    new THREE.BoxGeometry(14, 0.15, 0.1),
    new THREE.MeshLambertMaterial({ color: 0x8b6914 })
  );
  molding.position.set(0.5, 0.45, -6.05);
  scene.add(molding);

  // ── 십자가 ───────────────────────────────────────────────
  function makeCross(x, y, z, scale) {
    const g = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color: 0xffd700 });
    const v = new THREE.Mesh(new THREE.BoxGeometry(0.18 * scale, 1.8 * scale, 0.18 * scale), mat);
    v.castShadow = true;
    g.add(v);
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.9 * scale, 0.18 * scale, 0.18 * scale), mat);
    h.position.y = 0.45 * scale;
    h.castShadow = true;
    g.add(h);
    g.position.set(x, y, z);
    return g;
  }
  scene.add(makeCross(0.5, 2.2, -9.8, 1.0));

  // ── 강대상(Pulpit) ───────────────────────────────────────
  const pulpit = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 1.0, 0.7),
    new THREE.MeshLambertMaterial({ color: 0x6b4510 })
  );
  pulpit.position.set(-2.5, 1.0, -7.2);
  pulpit.castShadow = true;
  scene.add(pulpit);

  const pulpitTop = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 0.08, 0.8),
    new THREE.MeshLambertMaterial({ color: 0x8b6914 })
  );
  pulpitTop.position.set(-2.5, 1.55, -7.2);
  scene.add(pulpitTop);

  // ── 의자(Pews) ───────────────────────────────────────────
  const pewSeatMat = new THREE.MeshLambertMaterial({ color: 0x5c2f0a });
  const pewBackMat = new THREE.MeshLambertMaterial({ color: 0x7a3d10 });
  const pewLegMat  = new THREE.MeshLambertMaterial({ color: 0x3d1f05 });

  function makePew(cx, cz) {
    const g = new THREE.Group();
    for (const lx of [-1.5, 1.5]) {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.42, 0.5), pewLegMat);
      leg.position.set(lx, 0.21, 0);
      leg.castShadow = true;
      g.add(leg);
    }
    const seat = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.12, 0.5), pewSeatMat);
    seat.position.set(0, 0.46, 0);
    seat.castShadow = true;
    seat.receiveShadow = true;
    g.add(seat);
    const back = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.5, 0.1), pewBackMat);
    back.position.set(0, 0.75, -0.22);
    back.castShadow = true;
    g.add(back);
    g.position.set(cx, 0, cz);
    return g;
  }

  const pewRowsZ = [-3.5, -2.0, -0.5, 1.0, 2.5, 4.0, 5.5];
  for (const pz of pewRowsZ) {
    scene.add(makePew(-6.0, pz));
    scene.add(makePew(6.5, pz));
  }

  // ── 기둥(Pillars) ────────────────────────────────────────
  const pillarMat = new THREE.MeshLambertMaterial({ color: 0x4a3a6e });
  const capMat    = new THREE.MeshLambertMaterial({ color: 0x6a5a8e });

  function makePillar(x, z) {
    const g = new THREE.Group();
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 4.5, 8), pillarMat);
    shaft.position.y = 2.25;
    shaft.castShadow = true;
    g.add(shaft);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.25, 0.72), capMat);
    cap.position.y = 4.6;
    g.add(cap);
    const base = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.2, 0.68), capMat);
    base.position.y = 0.1;
    g.add(base);
    g.position.set(x, 0, z);
    return g;
  }

  for (const px of [-8.5, 8.5]) {
    for (const pz of [-7.5, -4.5, -1.5, 1.5, 4.5]) {
      scene.add(makePillar(px, pz));
    }
  }

  // ── 스테인드글라스 창문 ──────────────────────────────────
  function makeWindow(x, y, z, rotY) {
    const g = new THREE.Group();
    const colors = [0xff4400, 0x0066ff, 0xffcc00, 0x00aa44];
    const ww = 0.6, wh = 0.9;
    for (let i = 0; i < 2; i++) {
      for (let j = 0; j < 2; j++) {
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(ww, wh),
          new THREE.MeshBasicMaterial({ color: colors[i * 2 + j], transparent: true, opacity: 0.7, side: THREE.DoubleSide })
        );
        mesh.position.set((i - 0.5) * ww + 0.02, (j - 0.5) * wh + 0.02, 0);
        g.add(mesh);
      }
    }
    const frame = new THREE.Mesh(
      new THREE.PlaneGeometry(1.35, 1.95),
      new THREE.MeshBasicMaterial({ color: 0x2a1a4e, transparent: true, opacity: 0.9, side: THREE.DoubleSide })
    );
    frame.position.z = -0.01;
    g.add(frame);
    g.position.set(x, y, z);
    g.rotation.y = rotY;
    return g;
  }

  for (const wz of [-6.0, -3.0, 0.0, 3.0]) {
    scene.add(makeWindow(-10.45, 3.5, wz, Math.PI / 2));
    scene.add(makeWindow(11.45, 3.5, wz, Math.PI / 2));
  }

  // ── 제단 플레어 ──────────────────────────────────────────
  const flare = new THREE.Mesh(
    new THREE.CircleGeometry(0.5, 24),
    new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.18, side: THREE.DoubleSide })
  );
  flare.rotation.x = -Math.PI / 2;
  flare.position.set(0.5, 0.52, -9.8);
  scene.add(flare);

  // ── Character Builder ────────────────────────────────────
  function makeCharacter(hexColor, isSelf) {
    const group = new THREE.Group();
    const col   = hexColor;
    const light = blendHex(col, 0xffffff, 0.45);
    const dark  = blendHex(col, 0x000000, 0.3);

    const legGeo = new THREE.BoxGeometry(0.16, 0.38, 0.16);
    for (const lx of [-0.13, 0.13]) {
      const leg = new THREE.Mesh(legGeo, new THREE.MeshLambertMaterial({ color: dark }));
      leg.position.set(lx, 0.22, 0);
      leg.castShadow = true;
      group.add(leg);
    }
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(0.46, 0.56, 0.3),
      new THREE.MeshLambertMaterial({ color: col })
    );
    body.position.set(0, 0.68, 0);
    body.castShadow = true;
    group.add(body);

    const armGeo = new THREE.BoxGeometry(0.15, 0.44, 0.15);
    for (const ax of [-0.33, 0.33]) {
      const arm = new THREE.Mesh(armGeo, new THREE.MeshLambertMaterial({ color: light }));
      arm.position.set(ax, 0.64, 0);
      arm.castShadow = true;
      group.add(arm);
    }
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.24, 20, 20),
      new THREE.MeshLambertMaterial({ color: light })
    );
    head.position.set(0, 1.16, 0);
    head.castShadow = true;
    group.add(head);

    const eyeGeo = new THREE.SphereGeometry(0.045, 8, 8);
    for (const ex of [-0.1, 0.1]) {
      const eye = new THREE.Mesh(eyeGeo, new THREE.MeshBasicMaterial({ color: 0x1A1030 }));
      eye.position.set(ex, 1.17, 0.22);
      group.add(eye);
      const w = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      w.position.set(ex, 1.17, 0.2);
      group.add(w);
    }

    if (isSelf) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.38, 0.035, 8, 40),
        new THREE.MeshBasicMaterial({ color: 0xFFCE7A })
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.1;
      group.add(ring);
    }

    const disc = new THREE.Mesh(
      new THREE.CircleGeometry(0.32, 20),
      new THREE.MeshBasicMaterial({ color: 0x000000, opacity: 0.35, transparent: true })
    );
    disc.rotation.x = -Math.PI / 2;
    disc.position.y = 0.08;
    group.add(disc);

    return group;
  }

  // ── Player ───────────────────────────────────────────────
  const player = makeCharacter(0xFFB44D, true);
  scene.add(player);
  const playerTarget = new THREE.Vector3(0, 0, 2);
  player.position.copy(playerTarget);

  const indicator = new THREE.Mesh(
    new THREE.RingGeometry(0.28, 0.36, 24),
    new THREE.MeshBasicMaterial({ color: 0xFFCE7A, opacity: 0.6, transparent: true, side: THREE.DoubleSide })
  );
  indicator.rotation.x = -Math.PI / 2;
  indicator.position.y = 0.09;
  indicator.visible = false;
  scene.add(indicator);
  let indicatorTimer = 0;

  // ── Other Users ─────────────────────────────────────────
  const others = {};

  // ── Tap / Click ─────────────────────────────────────────
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

  function onTap(cx, cy) {
    mouse.x =  (cx / window.innerWidth)  * 2 - 1;
    mouse.y = -(cy / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hit = new THREE.Vector3();
    if (!raycaster.ray.intersectPlane(ground, hit)) return;

    const tx = Math.max(-HALF + 1, Math.min(HALF - 2, Math.round(hit.x)));
    const tz = Math.max(-HALF + 1, Math.min(HALF - 2, Math.round(hit.z)));
    playerTarget.set(tx, 0, tz);

    indicator.position.set(tx, 0.09, tz);
    indicator.visible = true;
    indicatorTimer = 0;

    try {
      FlutterChannel.postMessage(JSON.stringify({
        type: 'move',
        x: ((tx + HALF) / GRID) * 100,
        y: ((tz + HALF) / GRID) * 100,
      }));
    } catch (e) {}
  }

  renderer.domElement.addEventListener('click', e => onTap(e.clientX, e.clientY));
  renderer.domElement.addEventListener('touchend', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    onTap(t.clientX, t.clientY);
  }, { passive: false });

  // ── Flutter → JS API ─────────────────────────────────────
  window.setPlayerPosition = function (x, y) {
    const wx = (x / 100) * GRID - HALF;
    const wz = (y / 100) * GRID - HALF;
    playerTarget.set(wx, 0, wz);
    player.position.set(wx, 0, wz);
  };

  window.setOtherUsers = function (json) {
    const users = JSON.parse(json);
    const seen = new Set();
    users.forEach(u => {
      seen.add(u.uid);
      const wx = (u.x / 100) * GRID - HALF;
      const wz = (u.y / 100) * GRID - HALF;
      if (!others[u.uid]) {
        const col = parseInt(u.color, 16);
        const mesh = makeCharacter(col, false);
        mesh.position.set(wx, 0, wz);
        scene.add(mesh);
        others[u.uid] = { mesh, target: new THREE.Vector3(wx, 0, wz) };
      } else {
        others[u.uid].target.set(wx, 0, wz);
      }
    });
    Object.keys(others).forEach(uid => {
      if (!seen.has(uid)) {
        scene.remove(others[uid].mesh);
        delete others[uid];
      }
    });
  };

  // ── Animation ────────────────────────────────────────────
  const clock = new THREE.Clock();
  const camTarget = new THREE.Vector3();

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t  = clock.elapsedTime;

    // 제단 조명 맥동
    altarGlow.intensity = 1.3 + Math.sin(t * 1.2) * 0.3;
    flare.material.opacity = 0.12 + Math.sin(t * 1.2) * 0.06;

    // 스테인드글라스 조명 느린 변화
    stainedLeft.intensity  = 1.0 + Math.sin(t * 0.4) * 0.3;
    stainedRight.intensity = 1.0 + Math.cos(t * 0.4) * 0.3;

    // Player
    player.position.lerp(playerTarget, Math.min(1, 10 * dt));
    player.position.y = Math.abs(Math.sin(t * 3.2)) * 0.05;

    // Others
    Object.values(others).forEach(o => {
      o.mesh.position.lerp(o.target, Math.min(1, 8 * dt));
      o.mesh.position.y = Math.abs(Math.sin(t * 3.0 + o.mesh.id)) * 0.04;
    });

    // Indicator fade
    if (indicator.visible) {
      indicatorTimer += dt;
      indicator.material.opacity = Math.max(0, 0.6 - indicatorTimer * 1.2);
      if (indicatorTimer > 0.5) indicator.visible = false;
    }

    // Camera follows player
    camTarget.set(player.position.x + 14, 14, player.position.z + 14);
    camera.position.lerp(camTarget, Math.min(1, 5 * dt));
    camera.lookAt(player.position.x, 0, player.position.z);

    renderer.render(scene, camera);
  }
  animate();

  // ── Resize ───────────────────────────────────────────────
  window.addEventListener('resize', () => {
    const a = window.innerWidth / window.innerHeight;
    camera.left = -D * a; camera.right = D * a;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  setTimeout(() => {
    try { FlutterChannel.postMessage(JSON.stringify({ type: 'ready' })); } catch (e) {}
  }, 800);
})();
</script>
</body>
</html>
