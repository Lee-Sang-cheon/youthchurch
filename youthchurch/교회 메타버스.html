<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>교회 메타버스 · 청년부 라운지</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root{
    --light:#ffb24d; --glass1:#7c5cff; --glass2:#3bd6c6; --glass3:#ff7eb6; --dark:.42;
    --ink:#f4f1ff; --muted:rgba(236,233,255,.62);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
    background:radial-gradient(120% 120% at 50% 0%, #15131f 0%, #07060c 60%, #050409 100%);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:28px;
    -webkit-font-smoothing:antialiased; color:var(--ink);
  }
  .app-root{ position:relative; }

  /* ---------- glass utility ---------- */
  .glass{
    background:rgba(22,19,38,.52);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    backdrop-filter:blur(20px) saturate(150%);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 8px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.10);
  }

  /* ---------- stage / screen ---------- */
  .stage-wrap{ position:relative; height:100%; width:100%; overflow:hidden; background:#06050b; }
  .screen{ position:absolute; inset:0; }

  /* ---------- scene base ---------- */
  .scene{ position:absolute; inset:0; overflow:hidden; }
  .scene-sky{
    position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 50% 6%, color-mix(in oklab, var(--light) 22%, #241a3e) 0%, #160f2a 34%, #0c0820 64%, #070512 100%);
  }
  .worship-sky{
    background:radial-gradient(120% 80% at 50% 30%, #2a1330 0%, #160a22 46%, #08040f 100%);
  }
  .scene-vignette{
    position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(120% 80% at 50% 42%, transparent 38%, rgba(4,2,10,calc(.5 + var(--dark))) 100%);
    box-shadow:inset 0 0 120px rgba(0,0,0,.7);
  }

  /* side arches (architectural framing) */
  .arches{ position:absolute; top:0; bottom:30%; width:20%; pointer-events:none; }
  .arch-left{ left:0; background:linear-gradient(90deg, rgba(5,3,12,.92), transparent);
    border-top-right-radius:60% 30%; }
  .arch-right{ right:0; background:linear-gradient(270deg, rgba(5,3,12,.92), transparent);
    border-top-left-radius:60% 30%; }

  /* ---------- stained-glass window ---------- */
  .window-wrap{ position:absolute; top:6.5%; left:50%; transform:translateX(-50%); width:148px; height:218px; }
  .window-glow{
    position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    width:340px; height:340px; border-radius:50%;
    background:radial-gradient(circle, color-mix(in oklab, var(--light) 70%, #fff) 0%, color-mix(in oklab,var(--light) 40%, transparent) 26%, transparent 62%);
    filter:blur(8px); opacity:.85; mix-blend-mode:screen; animation:breathe 7s ease-in-out infinite;
  }
  .window{
    position:absolute; inset:0; border-radius:50% 50% 8px 8px / 64% 64% 8px 8px;
    overflow:hidden;
    box-shadow:0 0 1px rgba(0,0,0,.4), 0 0 40px color-mix(in oklab, var(--light) 50%, transparent);
  }
  .window-glass{
    position:absolute; inset:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1.1fr 1fr 1fr;
    gap:5px; background:#0a0814; padding:5px;
  }
  .pane{ position:relative; overflow:hidden; filter:saturate(1.5) brightness(1.18); }
  .pane::after{ content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 40% 30%, rgba(255,255,255,.55), transparent 60%); }
  .p1{ background:var(--glass1); border-radius:40px 40px 0 0; }
  .p2{ background:var(--glass2); border-radius:40px 40px 0 0; }
  .p3{ background:var(--glass3); }
  .p4{ background:var(--glass1); }
  .p5{ background:var(--glass2); }
  .p6{ background:var(--glass3); }
  .mullion-v{ position:absolute; left:50%; top:6px; bottom:6px; width:3px; transform:translateX(-50%);
    background:#0a0814; }
  .mullion-h{ position:absolute; left:6px; right:6px; top:50%; height:3px; background:#0a0814; }
  .window-frame{ position:absolute; inset:0; border-radius:inherit;
    border:4px solid #1c1530; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }

  /* ---------- cross ---------- */
  .cross-wrap{ position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); }
  .cross-halo{
    position:absolute; left:50%; top:42%; transform:translate(-50%,-50%);
    width:200px; height:200px; border-radius:50%;
    background:radial-gradient(circle, color-mix(in oklab,var(--light) 80%, #fff) 0%, transparent 58%);
    filter:blur(6px); opacity:.65; mix-blend-mode:screen; animation:breathe 6s ease-in-out infinite .5s;
  }
  .cross{ position:relative; width:46px; height:76px; }
  .cross-v,.cross-h{ position:absolute; border-radius:4px;
    background:linear-gradient(180deg, #fff8e8, color-mix(in oklab,var(--light) 70%, #fff));
    box-shadow:0 0 14px color-mix(in oklab,var(--light) 80%,#fff), 0 0 30px color-mix(in oklab,var(--light) 55%, transparent); }
  .cross-v{ left:50%; top:0; width:7px; height:100%; transform:translateX(-50%); }
  .cross-h{ top:26%; left:50%; width:42px; height:7px; transform:translateX(-50%); }
  .cross-core{ position:absolute; left:50%; top:26%; width:14px; height:14px; transform:translate(-50%,-30%);
    border-radius:50%; background:#fffdf5; filter:blur(2px);
    box-shadow:0 0 22px #fff, 0 0 44px color-mix(in oklab,var(--light) 70%,#fff); }

  /* ---------- godrays ---------- */
  .godrays{ position:absolute; top:11%; left:50%; height:74%; width:1px; pointer-events:none; z-index:3; }
  .godray{
    position:absolute; top:0; left:0; transform-origin:top center;
    width:60px; height:100%; margin-left:-30px;
    background:linear-gradient(180deg, color-mix(in oklab,var(--light) 60%, transparent) 0%, transparent 78%);
    filter:blur(11px); mix-blend-mode:screen; animation:rayflick 6s ease-in-out infinite;
  }
  @keyframes rayflick{ 0%,100%{ opacity:.42; } 50%{ opacity:.7; } }

  /* ---------- floor ---------- */
  .floor{ position:absolute; left:0; right:0; bottom:0; height:44%; overflow:hidden; }
  .floor-grid{
    position:absolute; left:-50%; right:-50%; bottom:0; height:120%;
    transform-origin:bottom center; transform:perspective(400px) rotateX(74deg);
    background:
      repeating-linear-gradient(to right, transparent 0 38px, color-mix(in oklab,var(--light) 26%, transparent) 38px 39px),
      repeating-linear-gradient(to bottom, transparent 0 38px, color-mix(in oklab,var(--light) 22%, transparent) 38px 39px);
    -webkit-mask-image:linear-gradient(to top, #000 0%, rgba(0,0,0,.35) 42%, transparent 78%);
    mask-image:linear-gradient(to top, #000 0%, rgba(0,0,0,.35) 42%, transparent 78%);
    opacity:.5;
  }
  .floor-pool{
    position:absolute; left:50%; bottom:-10%; transform:translateX(-50%);
    width:90%; height:80%;
    background:radial-gradient(ellipse at 50% 100%, color-mix(in oklab,var(--light) 40%, transparent) 0%, transparent 64%);
    filter:blur(6px); mix-blend-mode:screen;
  }
  .floor-tap{ position:absolute; left:0; right:0; bottom:0; height:40%; z-index:8; }

  /* ---------- dust ---------- */
  .dustfield{ position:absolute; inset:0; pointer-events:none; z-index:4; }
  .dust{ position:absolute; border-radius:50%; background:color-mix(in oklab,var(--light) 60%, #fff);
    box-shadow:0 0 6px color-mix(in oklab,var(--light) 60%,#fff); animation:floatdust linear infinite; }
  @keyframes floatdust{
    0%{ transform:translateY(0) translateX(0); }
    50%{ transform:translateY(-22px) translateX(10px); }
    100%{ transform:translateY(0) translateX(0); }
  }
  @keyframes breathe{ 0%,100%{ opacity:.6; transform:translate(-50%,-50%) scale(1); }
    50%{ opacity:.92; transform:translate(-50%,-50%) scale(1.06); } }

  /* ---------- avatars ---------- */
  .avatar-layer{ position:absolute; inset:0; z-index:10; }
  .avatar{ position:absolute; display:flex; flex-direction:column; align-items:center;
    background:none; border:none; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent;
    animation:bob 3.4s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateX(-50%) translateY(0) scale(var(--s,1)); } 50%{ transform:translateX(-50%) translateY(-5px) scale(var(--s,1)); } }
  .av-tag{
    font-size:10.5px; font-weight:600; color:#fff; letter-spacing:-.01em;
    padding:2px 8px; border-radius:999px; margin-bottom:5px; white-space:nowrap;
    background:rgba(14,11,26,.6); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.14); display:flex; align-items:center; gap:4px;
    box-shadow:0 3px 10px rgba(0,0,0,.4);
  }
  .av-live{ width:5px; height:5px; border-radius:50%; background:#ff4d6a; box-shadow:0 0 6px #ff4d6a; animation:pulse 1.4s infinite; }
  .av-body{ position:relative; width:34px; height:46px; }
  .av-glow{ position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    width:54px; height:54px; border-radius:50%;
    background:radial-gradient(circle, color-mix(in oklab,var(--ac) 60%, transparent) 0%, transparent 64%);
    filter:blur(4px); mix-blend-mode:screen; opacity:.9; animation:breathe2 3.6s ease-in-out infinite; }
  .av-head{ position:absolute; left:50%; top:0; transform:translateX(-50%); width:20px; height:20px; border-radius:50%;
    background:radial-gradient(circle at 35% 28%, var(--ac2), var(--ac));
    box-shadow:0 2px 8px rgba(0,0,0,.45), inset 0 -3px 6px rgba(0,0,0,.18); z-index:2; }
  .av-torso{ position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:30px; height:32px;
    border-radius:46% 46% 42% 42% / 60% 60% 40% 40%;
    background:linear-gradient(180deg, var(--ac2), var(--ac) 70%);
    box-shadow:0 4px 12px rgba(0,0,0,.4), inset 0 2px 6px rgba(255,255,255,.25); z-index:1; }
  .av-pool{ position:absolute; left:50%; bottom:-8px; transform:translateX(-50%);
    width:42px; height:13px; border-radius:50%;
    background:radial-gradient(ellipse at 50% 50%, color-mix(in oklab,var(--ac) 60%, transparent) 0%, transparent 68%);
    filter:blur(3px); mix-blend-mode:screen; }
  .avatar:active{ filter:brightness(1.15); }
  .avatar.is-selected .av-tag{ background:var(--ac); color:#1a1030; border-color:#fff; }
  .avatar.is-selected .av-glow{ opacity:1; filter:blur(7px); }

  /* figure variant: slimmer, taller torso */
  .avatar-figure .av-torso{ width:22px; height:34px; border-radius:44% 44% 30% 30% / 38% 38% 18% 18%; }
  .avatar-figure .av-head{ width:17px; height:17px; }
  /* orb variant: single glowing sphere */
  .avatar-orb .av-torso{ display:none; }
  .avatar-orb .av-head{ width:30px; height:30px; top:8px;
    background:radial-gradient(circle at 34% 30%, #fff, var(--ac2) 30%, var(--ac) 78%);
    box-shadow:0 0 20px color-mix(in oklab,var(--ac) 70%,transparent), 0 4px 12px rgba(0,0,0,.4); }
  .avatar-orb .av-glow{ width:46px; height:46px; top:30%; }

  /* self avatar */
  .is-self{ animation:bob 3s ease-in-out infinite; }
  .is-self .av-tag.self-tag{ background:linear-gradient(180deg,#fff5dc,#ffce7a); color:#3a2406; border-color:#fff; font-weight:800; }
  .self-ring{ position:absolute; left:50%; bottom:-10px; transform:translateX(-50%);
    width:48px; height:16px; border-radius:50%; border:2px solid rgba(255,221,150,.9);
    box-shadow:0 0 14px rgba(255,200,110,.7); animation:spinring 4s linear infinite; }
  @keyframes spinring{ 0%{ transform:translateX(-50%) rotate(0) scaleY(.42); } 100%{ transform:translateX(-50%) rotate(360deg) scaleY(.42); } }
  @keyframes breathe2{ 0%,100%{ opacity:.7; } 50%{ opacity:1; } }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }

  /* ---------- room portals ---------- */
  .portal-layer{ position:absolute; inset:0; z-index:9; }
  .portal{ position:absolute; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center;
    background:none; border:none; cursor:pointer; padding:0; -webkit-tap-highlight-color:transparent; }
  .portal-arch{ position:relative; width:58px; height:74px; border-radius:50% 50% 6px 6px / 60% 60% 6px 6px;
    background:linear-gradient(180deg, color-mix(in oklab,var(--ph) 30%, rgba(20,16,36,.5)), rgba(12,9,24,.7));
    border:1.5px solid color-mix(in oklab,var(--ph) 70%, #fff);
    box-shadow:0 0 22px color-mix(in oklab,var(--ph) 50%, transparent), inset 0 0 18px color-mix(in oklab,var(--ph) 40%, transparent);
    overflow:hidden; transition:transform .2s ease; }
  .portal-light{ position:absolute; left:50%; bottom:-30%; transform:translateX(-50%);
    width:80%; height:90%; border-radius:50%;
    background:radial-gradient(ellipse at 50% 100%, color-mix(in oklab,var(--ph) 75%, #fff) 0%, transparent 62%);
    filter:blur(3px); animation:breathe2 3s ease-in-out infinite; }
  .portal:active .portal-arch{ transform:scale(.94); }
  .portal-info{ display:flex; flex-direction:column; align-items:center; margin-top:7px; }
  .portal-label{ font-size:11.5px; font-weight:700; color:#fff; display:flex; align-items:center; gap:4px;
    text-shadow:0 1px 6px rgba(0,0,0,.7); }
  .portal-live-dot{ width:5px; height:5px; border-radius:50%; background:#ff4d6a; box-shadow:0 0 6px #ff4d6a; animation:pulse 1.3s infinite; }
  .portal-sub{ font-size:9.5px; color:var(--muted); margin-top:1px; text-shadow:0 1px 4px rgba(0,0,0,.7); }
  .portal-live .portal-arch{ animation:portalpulse 2.4s ease-in-out infinite; }
  @keyframes portalpulse{ 0%,100%{ box-shadow:0 0 22px color-mix(in oklab,var(--ph) 50%,transparent), inset 0 0 18px color-mix(in oklab,var(--ph) 40%,transparent); }
    50%{ box-shadow:0 0 40px color-mix(in oklab,var(--ph) 80%,transparent), inset 0 0 26px color-mix(in oklab,var(--ph) 55%,transparent); } }

  /* ---------- reactions ---------- */
  .reaction-layer{ position:absolute; inset:0; pointer-events:none; z-index:30; }
  .reaction{ position:absolute; font-size:24px; transform:translateX(-50%);
    animation:floatup 2.6s ease-out forwards;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
  @keyframes floatup{
    0%{ opacity:0; transform:translateX(-50%) translateY(10px) scale(.5); }
    18%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1.1); }
    100%{ opacity:0; transform:translateX(calc(-50% + var(--drift))) translateY(-140px) scale(.9); }
  }

  /* ---------- top HUD ---------- */
  .hud-top{ position:absolute; top:56px; left:14px; right:14px; z-index:40;
    display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .hud-pill{ display:flex; align-items:center; gap:8px; padding:8px 13px; border-radius:999px; white-space:nowrap; }
  .hud-pill .hud-space{ white-space:nowrap; }
  .live-dot{ width:8px; height:8px; border-radius:50%; background:#4be38a; box-shadow:0 0 8px #4be38a; animation:pulse 1.6s infinite; }
  .hud-space{ font-size:13px; font-weight:700; }
  .hud-sep{ width:1px; height:13px; background:rgba(255,255,255,.2); }
  .hud-count{ font-size:12px; color:var(--muted); }
  .hud-count b{ color:#fff; }
  .hud-icon{ width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .hud-me{ width:24px; height:24px; border-radius:50%; background:radial-gradient(circle at 34% 30%,#fff5dc,#ffb24d); box-shadow:inset 0 -2px 5px rgba(0,0,0,.2); }

  /* ---------- hints / banners ---------- */
  .hall-hint{ position:absolute; left:0; right:0; bottom:96px; text-align:center; z-index:35;
    font-size:11.5px; color:var(--muted); letter-spacing:-.01em; text-shadow:0 1px 6px rgba(0,0,0,.8); }
  .lounge-banner{ position:absolute; left:14px; right:14px; bottom:96px; z-index:35;
    border-radius:16px; padding:11px 15px; display:flex; flex-direction:column; gap:1px; }
  .lounge-banner b{ font-size:13px; } .lounge-banner span{ font-size:11px; color:var(--muted); }

  /* ---------- bottom nav ---------- */
  .bottom-nav{ position:absolute; left:14px; right:14px; bottom:24px; z-index:45;
    display:flex; justify-content:space-around; align-items:center; padding:8px 6px; border-radius:26px; }
  .nav-item{ background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:rgba(236,233,255,.5); font-size:10px; font-weight:600; padding:3px 8px; -webkit-tap-highlight-color:transparent; transition:color .15s; }
  .nav-item.is-active{ color:#fff; }
  .nav-item.is-active svg{ filter:drop-shadow(0 0 8px color-mix(in oklab,var(--light) 80%, #fff)); color:color-mix(in oklab,var(--light) 50%, #fff); }

  /* ---------- toast ---------- */
  .toast{ position:absolute; left:50%; bottom:150px; transform:translateX(-50%); z-index:60;
    padding:10px 16px; border-radius:14px; font-size:12.5px; font-weight:600; white-space:nowrap;
    animation:toastin .3s ease; }
  @keyframes toastin{ from{ opacity:0; transform:translate(-50%,8px); } to{ opacity:1; transform:translate(-50%,0); } }

  /* ---------- profile card ---------- */
  .profile-sheet{ position:absolute; inset:0; z-index:70; display:flex; align-items:flex-end; justify-content:center;
    background:rgba(4,2,10,.4); animation:fadein .2s ease; padding:0 14px 120px; }
  .profile-card{ width:100%; border-radius:24px; padding:18px; animation:sheetup .28s cubic-bezier(.2,.8,.2,1); }
  .profile-top{ display:flex; align-items:center; gap:12px; }
  .profile-ava{ width:50px; height:50px; border-radius:50%; flex-shrink:0; box-shadow:0 4px 14px rgba(0,0,0,.4), inset 0 -3px 8px rgba(0,0,0,.2); }
  .profile-meta{ flex:1; min-width:0; }
  .profile-name{ font-size:16px; font-weight:800; display:flex; align-items:center; gap:7px; }
  .badge-live{ font-size:8.5px; font-weight:800; letter-spacing:.04em; color:#fff; background:#ff4d6a; padding:1.5px 5px; border-radius:5px; }
  .profile-role{ font-size:12px; color:var(--muted); margin-top:2px; }
  .profile-x{ width:30px; height:30px; border-radius:50%; border:none; background:rgba(255,255,255,.08); color:var(--muted); font-size:13px; cursor:pointer; }
  .profile-status{ font-size:13.5px; color:#e9e4ff; margin:14px 2px 16px; line-height:1.5; }
  .profile-actions{ display:flex; gap:8px; }
  .pa{ border:none; cursor:pointer; border-radius:13px; font-family:inherit; font-weight:700; }
  .pa-primary{ flex:1; height:46px; font-size:14px; color:#1a1030; display:flex; align-items:center; justify-content:center; gap:6px;
    background:linear-gradient(180deg,#fff0cf,#ffc55e); box-shadow:0 6px 18px rgba(255,178,77,.35); }
  .pa-emoji{ font-size:16px; }
  .pa-ghost{ width:46px; height:46px; font-size:19px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); }

  /* ---------- panel overlay (chat / me) ---------- */
  .panel-overlay{ position:absolute; inset:0; z-index:65; display:flex; align-items:flex-end; justify-content:center;
    background:rgba(4,2,10,.45); animation:fadein .2s ease; }
  .panel{ width:100%; border-radius:26px 26px 0 0; padding:10px 18px calc(34px + 14px); max-height:78%; overflow:auto; animation:sheetup .3s cubic-bezier(.2,.8,.2,1); }
  .panel-grab{ width:38px; height:4px; border-radius:99px; background:rgba(255,255,255,.25); margin:2px auto 14px; }
  .panel-title{ font-size:16px; font-weight:800; margin-bottom:14px; }
  .chat-list{ display:flex; flex-direction:column; gap:14px; }
  .chat-row{ display:flex; gap:10px; align-items:flex-start; }
  .chat-ava{ width:32px; height:32px; border-radius:50%; flex-shrink:0; box-shadow:inset 0 -2px 5px rgba(0,0,0,.25); }
  .chat-u{ font-size:12px; font-weight:700; color:#fff; }
  .chat-c{ font-size:13px; color:#ded8f5; margin-top:2px; line-height:1.45; }
  .chat-input{ margin-top:16px; border-radius:14px; padding:12px 14px; font-size:13px; color:var(--muted);
    display:flex; align-items:center; justify-content:space-between; }
  .send{ color:color-mix(in oklab,var(--light) 50%, #fff); }
  .me-hero{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:6px 0 16px; }
  .me-ava{ width:72px; height:72px; border-radius:50%; background:radial-gradient(circle at 34% 30%,#fff5dc,#ffb24d);
    box-shadow:0 6px 20px rgba(255,178,77,.4), inset 0 -3px 9px rgba(0,0,0,.2); margin-bottom:10px; }
  .me-name{ font-size:18px; font-weight:800; display:flex; align-items:center; gap:8px; }
  .me-tag{ font-size:11px; font-weight:600; color:var(--muted); background:rgba(255,255,255,.08); padding:2px 8px; border-radius:8px; }
  .me-sub{ font-size:12.5px; color:var(--muted); margin-top:5px; }
  .me-stats{ display:flex; justify-content:space-around; padding:16px 0; margin:4px 0 8px; border-top:1px solid rgba(255,255,255,.08); border-bottom:1px solid rgba(255,255,255,.08); }
  .me-stats div{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .me-stats b{ font-size:19px; } .me-stats span{ font-size:11px; color:var(--muted); }
  .me-rows{ display:flex; flex-direction:column; gap:2px; margin-top:8px; }
